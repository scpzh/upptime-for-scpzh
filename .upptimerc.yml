# Change these first
owner: scpzh
repo: upptime-for-scpzh

sites:
  - name: SCP Miraheze CN Wiki
    url: https://scpfoundation.miraheze.org
    type: globalping
    location: Singapore
  - name: Cloudflare
    url: https://www.cloudflarestatus.com/api/v2/status.json
  - name: GitHub
    url: https://github.com
  - name: Wikidot
    url: https://www.wikidot.com

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.scpzh.org
  # baseUrl: /upptime-for-scpzh
  logoUrl: https://cdn.jsdelivr.net/gh/scpzh/upptime-for-scpzh@master/assets/scpmh-status-logo.svg
  favicon: https://cdn.jsdelivr.net/gh/scpzh/upptime-for-scpzh@master/assets/scpmh-status-logo.svg
  links:
    - rel: stylesheet
      href: https://cdn.jsdelivr.net/gh/scpzh/upptime-for-scpzh@master/assets/custom.css
  name: SCP-MH 状态页
  introTitle: "**欢迎来到 SCP Miraheze CN 状态页**"
  introMessage: "基于 **Upptime**，由GitHub Actions 与 Pages 驱动。"
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
